services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mirror_test
      POSTGRES_PASSWORD: mirror_test_pass
      POSTGRES_DB: mirror_memory_test
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mirror_test -d mirror_memory_test"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
